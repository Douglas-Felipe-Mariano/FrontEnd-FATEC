<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pizzaria FATEC</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>" />
  <style>
    /* =============================================
       Reset e Base
       ============================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff8f0;
      color: #333;
    }

    /* =============================================
       Header
       ============================================= */
    header {
      background-color: #c0392b;
      color: white;
      text-align: center;
      padding: 24px 16px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }

    header p {
      font-size: 1rem;
      opacity: 0.85;
    }

    /* =============================================
       Layout Principal
       ============================================= */
    main {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      padding: 32px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* =============================================
       Seção Cardápio
       ============================================= */
    .menu {
      flex: 1 1 55%;
    }

    .menu h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: #c0392b;
      border-bottom: 2px solid #c0392b;
      padding-bottom: 6px;
    }

    /* Grade de cards de pizza */
    .pizza-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    /* Card individual de pizza */
    .pizza-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s;
    }

    .pizza-card:hover {
      transform: translateY(-4px);
    }

    .pizza-card .emoji {
      font-size: 3rem;
    }

    .pizza-card h3 {
      font-size: 1rem;
      text-align: center;
    }

    .pizza-card .price {
      font-weight: bold;
      color: #c0392b;
      font-size: 1.1rem;
    }

    /* Botão Adicionar ao Carrinho */
    .btn-add {
      background-color: #c0392b;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #a93226;
    }

    /* =============================================
       Seção Carrinho
       ============================================= */
    .cart {
      flex: 1 1 35%;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      align-self: flex-start;
      position: sticky;
      top: 24px;
    }

    .cart h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: #c0392b;
      border-bottom: 2px solid #c0392b;
      padding-bottom: 6px;
    }

    /* Lista de itens */
    #cartList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    /* Item individual do carrinho */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff8f0;
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid #c0392b;
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cart-item-info span {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .cart-item-info small {
      color: #888;
      font-size: 0.82rem;
    }

    /* Botão Remover */
    .btn-remove {
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn-remove:hover {
      background-color: #c0392b;
    }

    /* Mensagem carrinho vazio */
    .empty-msg {
      text-align: center;
      color: #aaa;
      font-style: italic;
      padding: 20px 0;
    }

    /* Rodapé do carrinho */
    .cart-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 4px;
    }

    #cartTotal {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
    }

    /* Botão Limpar Carrinho */
    #clearBtn {
      background-color: #7f8c8d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s;
    }

    #clearBtn:hover {
      background-color: #636e72;
    }

    /* Oculta o rodapé quando não há itens */
    .cart-footer.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍕 Pizzaria FATEC</h1>
    <p>Cardápio & Carrinho de Compras</p>
  </header>

  <main>
    <!-- Seção do Cardápio -->
    <section class="menu" id="menu">
      <h2>Cardápio</h2>
      <div class="pizza-grid" id="pizzaGrid">
        <!-- Pizzas são inseridas via JavaScript -->
      </div>
    </section>

    <!-- Seção do Carrinho -->
    <section class="cart" id="cart">
      <h2>🛒 Carrinho</h2>

      <!-- Lista de itens do carrinho -->
      <ul id="cartList">
        <!-- Itens são inseridos via JavaScript -->
      </ul>

      <!-- Mensagem exibida quando o carrinho está vazio -->
      <p id="emptyMsg" class="empty-msg">Seu carrinho está vazio.</p>

      <!-- Rodapé do carrinho com total e botão de limpar -->
      <div class="cart-footer" id="cartFooter">
        <span id="cartTotal">Total: R$ 0,00</span>
        <button id="clearBtn" onclick="clearCart()">Limpar Carrinho</button>
      </div>
    </section>
  </main>

  <script>
    // =============================================
    // Dados do Cardápio
    // =============================================

    // Array com as pizzas disponíveis no cardápio
    const pizzas = [
      { id: 1, nome: "Margherita",         preco: 35.00, emoji: "🍕" },
      { id: 2, nome: "Calabresa",          preco: 38.00, emoji: "🌶️" },
      { id: 3, nome: "Portuguesa",         preco: 40.00, emoji: "🍳" },
      { id: 4, nome: "Frango c/ Catupiry", preco: 42.00, emoji: "🐔" },
      { id: 5, nome: "4 Queijos",          preco: 45.00, emoji: "🧀" },
      { id: 6, nome: "Pepperoni",          preco: 46.00, emoji: "🔴" },
    ];

    // =============================================
    // Estado do Carrinho
    // =============================================

    // Array que guarda os itens adicionados ao carrinho
    // Cada item: { cartId, id, nome, preco, emoji }
    let carrinho = [];

    // Contador para gerar IDs únicos por entrada no carrinho
    // (permite adicionar a mesma pizza mais de uma vez)
    let proximoCartId = 1;

    // =============================================
    // Renderização do Cardápio
    // =============================================

    /**
     * Gera os cards de pizza no HTML a partir do array `pizzas`.
     */
    function renderizarCardapio() {
      const grid = document.getElementById("pizzaGrid");

      pizzas.forEach(pizza => {
        // Cria o card
        const card = document.createElement("div");
        card.classList.add("pizza-card");

        card.innerHTML = `
          <div class="emoji">${pizza.emoji}</div>
          <h3>${pizza.nome}</h3>
          <span class="price">R$ ${pizza.preco.toFixed(2)}</span>
          <button class="btn-add" onclick="adicionarAoCarrinho(${pizza.id})">
            Adicionar 🛒
          </button>
        `;

        grid.appendChild(card);
      });
    }

    // =============================================
    // Funções do Carrinho
    // =============================================

    /**
     * Adiciona uma pizza ao carrinho com um ID de entrada único.
     * @param {number} pizzaId - ID da pizza no cardápio
     */
    function adicionarAoCarrinho(pizzaId) {
      // Busca a pizza no cardápio
      const pizza = pizzas.find(p => p.id === pizzaId);
      if (!pizza) return;

      // Cria um objeto de item do carrinho com ID único
      const item = {
        cartId: proximoCartId++, // ID exclusivo desta entrada
        id: pizza.id,
        nome: pizza.nome,
        preco: pizza.preco,
        emoji: pizza.emoji,
      };

      // Adiciona ao array do carrinho
      carrinho.push(item);

      // Atualiza a interface
      renderizarCarrinho();
    }

    /**
     * Remove um item do carrinho pelo seu cartId único.
     * @param {number} cartId - ID único do item no carrinho
     */
    function removerDoCarrinho(cartId) {
      // Filtra o array removendo apenas o item com o cartId correspondente
      carrinho = carrinho.filter(item => item.cartId !== cartId);

      // Atualiza a interface imediatamente
      renderizarCarrinho();
    }

    /**
     * Remove todos os itens do carrinho de uma vez.
     */
    function clearCart() {
      carrinho = [];
      renderizarCarrinho();
    }

    // =============================================
    // Renderização do Carrinho
    // =============================================

    /**
     * Atualiza o DOM do carrinho: lista de itens, total e visibilidade dos elementos.
     */
    function renderizarCarrinho() {
      const lista      = document.getElementById("cartList");
      const emptyMsg   = document.getElementById("emptyMsg");
      const cartFooter = document.getElementById("cartFooter");
      const cartTotal  = document.getElementById("cartTotal");

      // Limpa a lista atual antes de re-renderizar
      lista.innerHTML = "";

      if (carrinho.length === 0) {
        // Mostra mensagem de carrinho vazio e esconde o rodapé
        emptyMsg.style.display = "block";
        cartFooter.classList.add("hidden");
        return;
      }

      // Há itens: esconde a mensagem vazia e mostra o rodapé
      emptyMsg.style.display = "none";
      cartFooter.classList.remove("hidden");

      // Calcula o total somando o preço de cada item
      let total = 0;

      carrinho.forEach(item => {
        total += item.preco;

        // Cria o elemento <li> do item
        const li = document.createElement("li");
        li.classList.add("cart-item");
        li.setAttribute("data-cart-id", item.cartId); // facilita identificação no DOM

        li.innerHTML = `
          <div class="cart-item-info">
            <span>${item.emoji} ${item.nome}</span>
            <small>R$ ${item.preco.toFixed(2)}</small>
          </div>
          <!-- Botão Remover: chama removerDoCarrinho com o cartId deste item -->
          <button class="btn-remove" onclick="removerDoCarrinho(${item.cartId})">
            Remover ✕
          </button>
        `;

        lista.appendChild(li);
      });

      // Atualiza o total exibido
      cartTotal.textContent = `Total: R$ ${total.toFixed(2)}`;
    }

    // =============================================
    // Inicialização
    // =============================================

    // Renderiza o cardápio assim que o script é carregado
    renderizarCardapio();

    // Renderiza o carrinho (vazio) para configurar o estado inicial
    renderizarCarrinho();
  </script>
</body>
</html>
