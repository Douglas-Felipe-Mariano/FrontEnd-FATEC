<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pizzaria FATEC</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🍕 Pizzaria FATEC</h1>
    <p>Entre em contato conosco</p>
  </header>

  <main>
    <section class="form-section">
      <h2>📬 Formulário de Contato</h2>
      <p class="form-subtitle">Dúvidas, sugestões ou elogios? Fale com a gente!</p>

      <form id="contatoForm" onsubmit="enviarFormulario(event)" novalidate>

        <!-- Campo Nome -->
        <div class="form-group" id="group-nome">
          <label for="nome">Nome completo <span class="obrigatorio">*</span></label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex: João da Silva"
            autocomplete="name"
          />
          <!-- Mensagem de erro exibida via JavaScript -->
          <span class="erro" id="erro-nome"></span>
        </div>

        <!-- Campo E-mail -->
        <div class="form-group" id="group-email">
          <label for="email">E-mail <span class="obrigatorio">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ex: joao@email.com"
            autocomplete="email"
          />
          <span class="erro" id="erro-email"></span>
        </div>

        <!-- Campo Mensagem -->
        <div class="form-group" id="group-mensagem">
          <label for="mensagem">
            Mensagem <span class="obrigatorio">*</span>
            <!-- Contador de caracteres atualizado via JS -->
            <small id="contadorMsg" class="contador">0 / mín. 10 caracteres</small>
          </label>
          <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            placeholder="Escreva sua mensagem aqui..."
            oninput="atualizarContador()"
          ></textarea>
          <span class="erro" id="erro-mensagem"></span>
        </div>

        <!-- Botão de envio -->
        <button type="submit" class="btn-enviar">Enviar Mensagem 📨</button>

        <!-- Mensagem de sucesso exibida após envio válido -->
        <div class="sucesso hidden" id="msgSucesso">
          ✅ Mensagem enviada com sucesso! Entraremos em contato em breve.
        </div>

      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
